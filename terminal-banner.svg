<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Uzair Shahid — Developer Terminal</title>
  <desc id="desc">A midnight navy terminal banner with neon cyan details for a frontend and Angular developer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0b1728"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#163047" stroke-width="1" opacity=".5"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)" opacity=".8"/>
  <rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#24445a" stroke-width="2"/>
  <path d="M0 72H1200" stroke="#24445a" stroke-width="1.5"/>
  <rect x="28" y="24" width="12" height="12" rx="6" fill="#fb7185"/>
  <rect x="49" y="24" width="12" height="12" rx="6" fill="#fbbf24"/>
  <rect x="70" y="24" width="12" height="12" rx="6" fill="#34d399"/>
  <text x="104" y="35" fill="#8aa4b8" font-family="Consolas, 'Courier New', monospace" font-size="15">uzair@developer-workstation: ~/profile</text>
  <text x="1148" y="35" fill="#67e8f9" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="14">[ ONLINE ]</text>
  <path d="M820 110L1050 110L1140 200L1050 290L820 290" fill="none" stroke="#164e63" stroke-width="2" opacity=".65"/>
  <path d="M870 132L1040 132L1108 200L1040 268L870 268" fill="none" stroke="#155e75" stroke-width="1.5" opacity=".7"/>
  <circle cx="1022" cy="200" r="72" fill="#083344" opacity=".25"/>
  <circle cx="1022" cy="200" r="54" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity=".65"/>
  <path d="M1004 175L980 200L1004 225M1040 175L1064 200L1040 225M1030 166L1014 234" fill="none" stroke="url(#glow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
  <text x="54" y="126" fill="#67e8f9" font-family="Consolas, 'Courier New', monospace" font-size="17">$ whoami</text>
  <text x="54" y="181" fill="#f1f5f9" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" letter-spacing="1">MUHAMMAD UZAIR SHAHID</text>
  <rect x="55" y="201" width="5" height="34" rx="2" fill="#67e8f9"/>
  <text x="76" y="224" fill="#67e8f9" font-family="Consolas, 'Courier New', monospace" font-size="22">Frontend Engineer</text>
  <text x="76" y="253" fill="#b6c9d8" font-family="Consolas, 'Courier New', monospace" font-size="18">// Angular · Full-stack · AI tools</text>
  <text x="55" y="311" fill="#7895a9" font-family="Consolas, 'Courier New', monospace" font-size="15">BUILDING USEFUL THINGS, ONE COMMIT AT A TIME.</text>
  <rect x="55" y="329" width="300" height="3" rx="1.5" fill="url(#glow)"/>
  <rect x="364" y="329" width="72" height="3" rx="1.5" fill="#164e63"/>
</svg>
